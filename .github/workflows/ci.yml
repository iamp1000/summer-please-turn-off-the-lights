name: Project checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and web syntax
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Check web JavaScript syntax
        run: node --check web/app.js
